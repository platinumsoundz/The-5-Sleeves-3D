<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#182b25"><title>The 5 Sleeves — Training Ground</title><link rel="stylesheet" href="src/styles.css"></head><body>
<main id="game"><div id="hud"><div class="brand">THE 5 SLEEVES <span>TRAINING GROUND</span></div><div class="status"><div><b>YOU</b><div class="bar"><i id="player-health"></i></div></div><div id="phase">TUTORIAL</div><div><b>SENSEI</b><div class="bar"><i id="sensei-health"></i></div></div></div><div id="score">○○○ — ○○○</div><div id="warning" role="status" aria-label="Sensei is winding up" hidden>!</div><div id="device" role="status">INPUT: DETECTING</div><div id="fps" aria-hidden="true">— FPS</div><div id="prompt"></div><button id="skip" type="button">SKIP TUTORIAL</button><button id="restart" type="button" hidden>RESTART PRACTICE</button><div id="message" role="status"></div><div id="result" hidden></div></div><div id="touch-controls" aria-label="Touch controls"><div class="move-pad"><button data-action="forward">▲</button><button data-action="left">◀</button><button data-action="back">▼</button><button data-action="right">▶</button></div><div class="action-pad"><button data-action="attack">STAFF</button><button data-action="guard">GUARD</button><button data-action="jump">JUMP</button><button data-action="aim">AIM</button><button data-action="confirm">A / UP</button><button data-action="sprint">RUN</button><button data-action="crouch">CROUCH</button></div></div><div id="loading">Preparing training ground…</div></main><script type="module" src="src/main.js"></script><script>
window.addEventListener('error', function (event) {
  if (window.__trainingReady) return;
  if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
    var note = document.querySelector('#loading');
    if (note) note.textContent = 'Could not load the training ground. Check your connection and reload.';
  }
}, true);
window.addEventListener('unhandledrejection', function () {
  if (window.__trainingReady) return;
  var note = document.querySelector('#loading');
  if (note) note.textContent = 'The training ground failed to start. Reload to try again.';
});
setTimeout(function () {
  if (window.__trainingReady) return;
  var note = document.querySelector('#loading');
  if (note) note.textContent = 'Still loading… three.js needs a network connection. Reload if this stays stuck.';
}, 12000);
</script></body></html>
