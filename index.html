<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#182b25"><title>The 5 Sleeves — Training Ground</title><link rel="stylesheet" href="src/styles.css"></head><body>
<main id="game"><div id="hud"><div class="brand">THE 5 SLEEVES <span>TRAINING GROUND</span></div><div class="status"><div><b>YOU</b><div class="bar"><i id="player-health"></i></div></div><div id="phase">TUTORIAL</div><div><b>SENSEI</b><div class="bar"><i id="sensei-health"></i></div></div></div><div id="score">○○○ — ○○○</div><div id="warning" role="status" aria-label="Sensei is winding up" hidden>!</div><div id="device" role="status">INPUT: DETECTING</div><div id="fps" aria-hidden="true">— FPS</div><div id="prompt"></div><button id="skip" type="button">SKIP TUTORIAL</button><button id="restart" type="button" hidden>RESTART PRACTICE</button><button id="pause" data-action="pause" type="button" aria-label="Pause and settings">MENU</button><div id="message" role="status"></div><div id="result" hidden></div></div><div id="touch-controls" aria-label="Touch controls"><div id="stick-zone" aria-label="Movement joystick"><div id="stick-base"><div id="stick-knob"></div></div></div><div class="action-pad"><button data-action="aim" class="aim">AIM</button><button data-action="attack" class="staff">STAFF</button><button data-action="jump" class="jump">JUMP</button><button data-action="guard" class="guard">GUARD</button><button data-action="crouch" class="crouch">CROUCH</button><button data-action="sprint" class="sprint">RUN</button><button data-action="interact" class="interact">USE</button><button data-action="confirm" class="confirm">A / UP</button></div><button id="fire" data-action="attack" hidden>FIRE</button></div><div id="reticle" aria-hidden="true" hidden></div><div id="settings" role="dialog" aria-label="Paused and settings" hidden><h2>PAUSED</h2><label for="sensitivity">Look sensitivity</label><input id="sensitivity" type="range" min="0.4" max="2" step="0.05" value="1"><label class="check" for="invert"><input id="invert" type="checkbox"> Invert vertical look</label><label for="quality">Graphics</label><select id="quality"><option value="performance">Performance</option><option value="balanced">Balanced</option><option value="sharp">Sharp</option></select><button id="resume" data-action="pause" type="button">RESUME</button><p class="hint">Esc or MENU also toggles pause.</p></div><div id="loading">Preparing training ground…</div></main><script type="module" src="src/main.js"></script><script>
window.addEventListener('error', function (event) {
  if (window.__trainingReady) return;
  if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
    var note = document.querySelector('#loading');
    if (note) note.textContent = 'Could not load the training ground. Check your connection and reload.';
  }
}, true);
window.addEventListener('unhandledrejection', function () {
  if (window.__trainingReady) return;
  var note = document.querySelector('#loading');
  if (note) note.textContent = 'The training ground failed to start. Reload to try again.';
});
setTimeout(function () {
  if (window.__trainingReady) return;
  var note = document.querySelector('#loading');
  if (note) note.textContent = 'Still loading… three.js needs a network connection. Reload if this stays stuck.';
}, 12000);
</script></body></html>
